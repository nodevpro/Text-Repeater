  <form>
    <fieldset>
      <br>
      <label class="enter">Text: </label>
      <input type="text" id="text"> <br>
      <br>
      <label class="enter">Number Of Repetition: </label>
      <input id="num" type="number"><br>
      <br>
      <div class="cen">
       <button type="button" id="btn" onclick="generate()">Generate</button></div>

   <div id="border">
    <div id="result"></div>
        <button type="button" id="copyBtn" onclick="copy()">Copy</button>
